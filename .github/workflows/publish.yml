name: publish npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag pointing to current main, such as v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'motif-Labs/motif-solo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version and exact workflow source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run privacy:check
      - run: npm run package:check
      - run: npm audit
      - run: npm run license:check
      - name: Pack validated source
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package
      - run: npm publish ./package/*.tgz --access public --provenance --ignore-scripts
